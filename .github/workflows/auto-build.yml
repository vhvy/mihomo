name: Auto Merge & Build

# 定时把上游 Alpha 合并进本功能分支（仅临时合并用于构建，不改写分支历史），
# 编译 + 测试通过后构建并推送 Docker 镜像；任一步失败则开 Issue 通知，不发布坏镜像。
#
# 所有私密信息（registry / 账号 / 密码 / 命名空间）均来自 GitHub Secrets，
# 本文件不含任何私密值，可安全放在公开仓库。

on:
  schedule:
    - cron: '17 18 * * *'    # 错峰避开整点；UTC 18:17 = 北京时间次日 02:17
  workflow_dispatch:          # 也可在 Actions 页面手动触发

concurrency:
  group: auto-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # 本 job 不开 Issue，开 Issue 由 notify-on-failure 负责
    steps:
      - name: Checkout 功能分支
        uses: actions/checkout@v7
        with:
          ref: feat/wireguard-inbound
          fetch-depth: 0

      - name: 临时合并上游 Alpha（冲突则失败）
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # 记录功能分支与上游各自的 tip，供镜像 tag 追溯——合并产生的
          # merge commit 只存在于本次 runner，不会 push，不能用作 tag。
          echo "FEAT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          git remote add upstream https://github.com/MetaCubeX/mihomo.git
          git fetch --no-tags upstream Alpha
          echo "UPSTREAM_HASH=$(git rev-parse --short upstream/Alpha)" >> "$GITHUB_ENV"
          # 仅在本次 runner 内做合并用于构建，不 push 回分支。
          if ! git merge --no-edit upstream/Alpha; then
            echo "::error::与上游 Alpha 合并冲突，需要手动 rebase 解决"
            git merge --abort || true
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # go.mod 声明 go 1.20，全部依赖声明的最高版本也只有 1.20，所以 1.24 足够。
          # 本地开发用的是 go1.26.5，上游 CI 矩阵覆盖 1.20~1.26。
          go-version: '1.24'

      - name: 编译检查（功能失效第一道防线）
        run: |
          # 两轮都要跑：wireguard 入站在无 with_gvisor 时走 stack_stub.go，
          # 只跑带 tag 那轮会漏掉 stub 路径的编译错误（上游 CI 同样跑两轮）。
          go build -tags with_gvisor ./...
          go build ./...

      - name: 运行测试
        env:
          SKIP_CONCURRENT_TEST: '1'
          SKIP_INTEROP_TEST: '1'
        run: |
          # 重点测试你的功能相关包；如需全量可改成 ./...
          # 无 tag 那轮里 TestInboundWireGuard 应当 SKIP（features.WithGVisor 判断），
          # 若变成 FAIL 说明 skip 逻辑丢失，会在上游 CI 的无 tag 轮次里翻车。
          go test -tags with_gvisor -count=1 \
            ./listener/... ./config/... ./constant/...
          go test -count=1 \
            ./listener/... ./config/... ./constant/...

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: 构建并推送镜像
        env:
          IMAGE: ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.IMAGE_NAME }}
          PUSH: 'true'
          # 用两个真实存在的 commit 标识镜像（功能分支 tip + 上游 Alpha tip），
          # 替代 runner 内临时 merge commit 的 hash
          COMMIT_HASH: ${{ env.FEAT_HASH }}-alpha.${{ env.UPSTREAM_HASH }}
        run: bash scripts/build-image.sh

  # 上面任一步失败（合并冲突 / 编译失败 / 测试不过）都通知
  notify-on-failure:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 开 Issue 提醒
        uses: actions/github-script@v7
        with:
          script: |
            // 定时任务每天都会跑，上游一旦引入 breaking change 就会天天失败。
            // 已有未关闭的同类 Issue 时只追加评论，避免每天开一个新 Issue。
            const label = 'auto-build-failure';
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            // listForRepo 也会返回 PR，按 label 过滤后基本不会命中，仍显式排除
            const openIssue = existing.data.find(i => !i.pull_request);

            if (openIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssue.number,
                body: `⚠️ ${today} 再次失败: ${runUrl}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ 自动构建失败 ${today}`,
              labels: [label],   // label 不存在时会由本次调用自动创建
              body: [
                '自动同步上游 / 编译 / 测试 / 构建镜像 过程中失败。',
                '可能原因：与上游 Alpha 合并冲突，或上游改动导致 wireguard 功能编译/测试失败。',
                '',
                `查看日志: ${runUrl}`,
                '',
                '后续失败会以评论形式追加到本 Issue，修好后请手动关闭。',
                '',
                '若为合并冲突，本地解决：',
                '```',
                'git fetch upstream Alpha',
                'git checkout feat/wireguard-inbound',
                'git rebase upstream/Alpha   # 解决 metadata.go / parse.go / config.yaml 冲突',
                'git push --force-with-lease origin feat/wireguard-inbound',
                '```',
              ].join('\n'),
            });
